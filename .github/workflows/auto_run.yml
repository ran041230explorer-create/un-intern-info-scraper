name: UN Job Auto Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        pip install -r requirements.txt
        python -m playwright install --with-deps chromium

    - name: 运行主程序 (main.py)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 强制指定输出文件名，确保与后面的发邮件脚本完全一致
        OUTPUT_DOCX_PATH: un_internships.docx 
      run: |
        # 直接运行总控脚本，它会自动处理爬取、JSON保存和Word生成
        python main.py

    - name: 发送邮件
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        if [ -f "un_internships.docx" ]; then
          python send_email.py
        else
          echo "没有生成结果文档，无需发送邮件。"
        fi
